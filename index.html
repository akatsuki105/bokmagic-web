<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>bokmagic-web</title>
    <style>
      :root {
        color-scheme: light dark;
        --checker-a: light-dark(#ffffff, #3a3a3a);
        --checker-b: light-dark(#d8d8d8, #303030);
        /* 目が疲れにくいように、ダークモードの文字は白でなく少し暗い灰色にする */
        --text: light-dark(#333b3c, #d0d0d0);
        --link: light-dark(#2f55c9, #8ea6e6);
        /* 英数字と日本語で字形がそろうように、フォントを具体的に指定する (日本語は等幅でもヒラギノなどの同じゴシックで出す) */
        --font-sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color: var(--text);
        background-color: light-dark(#efedea, #282828);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.6;
        overflow: hidden;
      }
      a {
        color: var(--link);
      }
      button,
      input,
      select {
        font-family: inherit;
      }
      /* 一覧と表は行数が多いので、本文より少しだけ詰める */
      .sprite-list,
      .pltt-table {
        line-height: 1.4;
      }
      /* 画面の高さに収める: 上の1行は固定し、タブ・一覧・本文はそれぞれスクロールする */
      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 6px 12px;
        border-bottom: 1px solid light-dark(#cfcac3, #444444);
      }
      .app-header h1 {
        font-size: 18px;
        margin: 0 auto 0 0; /* タイトル以外は右に寄せる */
      }
      .app-header h1 a {
        color: inherit;
        text-decoration: none;
      }
      .rom-name {
        font-family: var(--font-mono);
      }
      .no-rom {
        padding: 0 12px;
      }
      button,
      input,
      select {
        font-size: 15px;
      }
      .spacer-y {
        height: 1.5em;
      }
      .error {
        color: #d33;
      }
      .app-body {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 1em;
      }
      .tab-body {
        display: contents;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        gap: 2px;
        padding-top: 8px;
        padding-right: 8px;
        overflow-y: auto;
        border-right: 1px solid light-dark(#dcd7d0, #3a3a3a); /* 一覧との区切り, 目立たない色 */
      }
      .tab {
        padding: 4px 8px;
        color: inherit;
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      .tab.selected {
        background: light-dark(#cfd8ff, #3a4470);
        border-left-color: #4a6cff;
      }
      .viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        gap: 1em;
      }
      .stepper {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .anim-refs {
        font-family: var(--font-mono);
        font-size: 14px;
        margin: 0.25em 0;
        opacity: 0.8;
      }
      .sprite-list {
        list-style: none;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
        white-space: nowrap;
        overflow-y: auto;
        padding-top: 8px;
        font-family: var(--font-mono);
      }
      /* 一覧の上に検索欄などがあるもの */
      .list-pane {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
        padding-top: 8px;
      }
      .list-pane > .sprite-list {
        flex: 1;
        min-height: 0;
      }
      .sprite-list li {
        padding: 2px 4px;
        cursor: pointer;
      }
      .sprite-list li.selected {
        background: light-dark(#cfd8ff, #3a4470);
      }
      .sprite-view {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 0 12px 24px 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1em;
        align-items: center;
      }
      .controls input[type="number"] {
        width: 5em;
      }
      .canvas-wrap {
        position: relative;
        margin: 0.5em 0;
        background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 16px 16px;
      }
      .canvas-wrap canvas {
        display: block;
        image-rendering: pixelated;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(to right, rgb(255 0 0 / 0.35) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 0 0 / 0.35) 1px, transparent 1px);
      }
      .origin-x,
      .origin-y {
        position: absolute;
        background: rgb(255 0 0 / 0.5);
        pointer-events: none;
      }
      .origin-x {
        left: 0;
        right: 0;
        height: 1px;
      }
      .origin-y {
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .pltt-row {
        display: flex;
        align-items: center;
        gap: 2px;
        font-family: var(--font-mono);
      }
      .pltt-row > span:first-child {
        width: 3em;
      }
      .swatch {
        width: 14px;
        height: 14px;
      }
      .pltt-list li {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .pltt-id {
        width: 3em;
        opacity: 0.5;
      }
      .pltt-id.used {
        opacity: 1;
      }
      .swatch.large {
        display: inline-block;
        width: 32px;
        height: 18px;
        vertical-align: middle;
      }
      .pltt-table {
        border-collapse: collapse;
        font-family: var(--font-mono);
      }
      .pltt-table th,
      .pltt-table td {
        padding: 1px 8px;
        text-align: left;
      }
      .bgpltt-grid {
        width: fit-content;
        margin: 0.5em 0;
      }
      .bgpltt-grid .pltt-row {
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .bgpltt-grid .pltt-row.selected {
        background: light-dark(#cfd8ff, #3a4470);
        border-left-color: #4a6cff;
      }
      .bokc {
        font-family: var(--font-mono);
        font-size: 16px;
        line-height: 1.5;
        tab-size: 4;
        white-space: pre;
        overflow-x: auto;
        margin: 0;
        padding: 0.75em 1em;
        background: light-dark(#e2dfda, #333333);
        border: 1px solid light-dark(#cfcac3, #444444);
        border-radius: 4px;
      }
      .aliases {
        margin: 0.5em 0;
      }
      .aliases summary {
        cursor: pointer;
      }
      .sprite-list a {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .dim {
        opacity: 0.5;
      }
      button.selected {
        outline: 2px solid #4a6cff;
      }
      .script-loads {
        font-size: 14px;
      }
      .seek input[type="range"] {
        flex: 1;
        max-width: 480px;
      }
      /* マウスの下の情報を出す1行, 何も無いときも高さを保つ */
      .hover-line {
        min-height: 1.5em;
      }
      .info-table {
        margin-top: 1em;
      }
      .info-table th {
        white-space: nowrap;
        vertical-align: top;
      }
      .hover-info {
        min-height: 3em;
      }
      .load-link + .load-link {
        margin-left: 0.5em;
      }
      .overlay-host {
        position: relative;
        width: fit-content;
        margin: 0.5em 0;
      }
      .overlay-host .canvas-wrap {
        margin: 0;
      }
      .collision-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .collision-canvas {
        display: block;
        margin: 0.5em 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-family: var(--font-mono);
        font-size: 14px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .legend-item.selected {
        outline: 2px solid #4a6cff;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .pltt-users {
        font-family: var(--font-mono);
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 1em;
      }
      .thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 12px;
      }
      .thumb.selected {
        border-color: #4a6cff;
      }
      .anim-panel {
        margin: 0.5em 0;
        padding: 0.5em;
        border: 1px solid light-dark(#ccc, #444);
      }
      .anim-panel .controls + .controls {
        margin-top: 0.5em;
      }
      .anim-status {
        font-family: var(--font-mono);
        margin: 0.5em 0;
      }
      .anim-cmds {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 14px;
      }
      .anim-cmd {
        padding: 1px 4px;
        border: 1px solid light-dark(#ccc, #444);
        cursor: pointer;
      }
      .anim-cmd.current {
        background: light-dark(#cfd8ff, #3a4470);
      }
      .thumb .canvas-wrap {
        margin: 0;
      }
    </style>
    <script type="module" src="./bundle.js"></script>
  </head>
</html>
