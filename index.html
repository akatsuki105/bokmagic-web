<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>bokmagic-web</title>
    <meta name="description" content="ボクらの太陽シリーズの ROM のアセットビューワ" />
    <!-- SNS で URL を貼ったときのプレビュー (画像は付けない) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bokmagic-web" />
    <meta property="og:title" content="bokmagic-web" />
    <meta property="og:description" content="ボクらの太陽シリーズの ROM のアセットビューワ" />
    <meta property="og:url" content="https://akatsuki105.github.io/bokmagic-web/" />
    <meta name="twitter:card" content="summary" />
    <style>
      :root {
        color-scheme: light dark;
        /* ダークモードの地の色は、ごく弱い青みの灰色 (スレート). 外側ほど暗く、読む所ほど明るくして、線を引かずに領域を区切る
           ヘッダとタブ (--bg-side) < 一覧 (--bg-list) < 本文 (--bg-body) < カード (--bg-card). ライトモードは暖かい白で、カード以外は同じ色 */
        --bg-side: light-dark(#efedea, #17191d);
        --bg-list: light-dark(#efedea, #1c1f24);
        --bg-body: light-dark(#efedea, #22252b);
        --bg-card: light-dark(#f8f7f5, #2b2f36);
        --border: light-dark(#cfcac3, #3b4049);
        /* 絵の後ろの市松模様は、ドット絵の色の見え方を変えないよう無彩色のまま */
        --checker-a: light-dark(#ffffff, #3a3a3a);
        --checker-b: light-dark(#d8d8d8, #303030);
        /* 目が疲れにくいように、ダークモードの文字は白でなく少し暗い灰色にする. 控えめな文字は説明, 表の項目名, カードの見出し */
        --text: light-dark(#333b3c, #d3d7dd);
        --text-dim: light-dark(#6f7374, #8c939d);
        --link: light-dark(#2f55c9, #91a9f2);
        --error: light-dark(#cc3333, #ff8080);
        /* 選択と強調は青の 1 系統 */
        --accent: light-dark(#4a6cff, #7290ff);
        --bg-selected: light-dark(#cfd8ff, #34415f);
        /* 一覧の縞 */
        --stripe: light-dark(transparent, rgb(255 255 255 / 0.06)); /* 偶数行 (明るく) */
        --stripe-odd: light-dark(transparent, rgb(0 0 0 / 0.18)); /* 奇数行 (暗く) */
        /* ボタンと入力欄 (ブラウザ標準の見た目は暗い画面で浮くので自分で塗る) */
        --bg-input: light-dark(#ffffff, #16181c);
        --bg-button: light-dark(#e9e6e2, #353a43);
        --bg-button-hover: light-dark(#dedad4, #40464f);
        /* 英数字と日本語で字形がそろうように、フォントを具体的に指定する (日本語は等幅でもヒラギノなどの同じゴシックで出す) */
        --font-sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color: var(--text);
        background-color: var(--bg-body);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.6;
        overflow: hidden;
      }
      a {
        color: var(--link);
      }
      button,
      input,
      select {
        font-family: inherit;
        color: inherit;
      }
      input[type="number"],
      input[type="text"],
      input[type="search"],
      select {
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
      }
      button {
        background: var(--bg-button);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--bg-button-hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.selected {
        background: var(--bg-selected);
        border-color: var(--accent);
      }
      input[type="checkbox"],
      input[type="radio"],
      input[type="range"] {
        accent-color: var(--accent);
      }
      /* 表は行数が多いので、本文より少しだけ詰める (一覧は読みやすさを優先して .sprite-list で広めに取る) */
      .pltt-table {
        line-height: 1.4;
      }
      /* 画面の高さに収める: 上の1行は固定し、タブ・一覧・本文はそれぞれスクロールする */
      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 6px 12px;
        background: var(--bg-side);
        border-bottom: 1px solid light-dark(#cfcac3, transparent); /* ダークモードは背景の違いで区切る */
      }
      .app-header h1 {
        font-size: 18px;
        margin: 0 auto 0 0; /* タイトル以外は右に寄せる */
      }
      .app-header h1 a {
        color: inherit;
        text-decoration: none;
      }
      .rom-name {
        font-family: var(--font-mono);
      }
      .no-rom {
        padding: 0 12px;
        overflow-y: auto;
      }
      .no-rom h2 {
        font-size: 1.1em;
        margin: 1.5em 0 0.5em;
      }
      .saved-roms {
        border-collapse: collapse;
        margin-bottom: 1em;
      }
      .saved-roms th,
      .saved-roms td {
        padding: 4px 12px 4px 0;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .saved-roms th {
        font-weight: normal;
        opacity: 0.7;
      }
      button,
      input,
      select {
        font-size: 15px;
      }
      .spacer-y {
        height: 1.5em;
      }
      .error {
        color: var(--error);
      }
      .app-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .tab-body {
        display: contents;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        gap: 8px;
        padding-top: 8px;
        padding-right: 8px;
        overflow-y: auto;
        background: var(--bg-side);
        border-right: 1px solid light-dark(#dcd7d0, transparent); /* 一覧との区切り. ダークモードは背景の違いで区切る */
      }
      .tab {
        padding: 10px 14px;
        font-size: 18px;
        font-weight: bold;
        color: inherit;
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      .tab.selected {
        background: var(--bg-selected);
        border-left-color: var(--accent);
      }
      .viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      /* 左の一覧. 本文との間は隙間ではなく余白で空け、背景を途切れさせない */
      .viewer > .sprite-list,
      .viewer > .list-pane {
        background: var(--bg-list);
        padding: 8px 8px 0 12px;
        max-width: 25vw; /* 長い名前で本文が狭くならないように. はみ出す名前は「…」で切り、マウスを乗せると全体を出す (index.tsx) */
      }
      .stepper {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .stepper input[type="number"],
      .field-value input[type="number"] {
        width: 4.5em;
      }
      .sprite-list {
        list-style: none;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
        white-space: nowrap;
        overflow-y: auto;
        padding-top: 8px;
        font-family: var(--font-mono);
        font-size: 17px;
        line-height: 1.5;
      }
      /* 一覧の上に検索欄などがあるもの */
      .list-pane {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
        padding-top: 8px;
      }
      .list-pane > .sprite-list {
        flex: 1;
        min-height: 0;
        padding-top: 0;
      }
      .sprite-list li,
      .sprite-list a {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sprite-list li {
        padding: 6px 8px;
        cursor: pointer;
      }
      .sprite-list li:nth-child(odd) {
        background: var(--stripe-odd);
      }
      .sprite-list li:nth-child(even) {
        background: var(--stripe);
      }
      .sprite-list li.selected {
        background: var(--bg-selected);
      }
      .sprite-view {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 0 12px 24px 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1em;
        align-items: center;
      }
      .controls input[type="number"] {
        width: 5em;
      }
      .canvas-wrap {
        position: relative;
        margin: 0.5em 0;
        background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 16px 16px;
      }
      .canvas-wrap canvas {
        display: block;
        image-rendering: pixelated;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(to right, rgb(255 0 0 / 0.35) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 0 0 / 0.35) 1px, transparent 1px);
      }
      .origin-x,
      .origin-y {
        position: absolute;
        background: rgb(255 0 0 / 0.5);
        pointer-events: none;
      }
      .origin-x {
        left: 0;
        right: 0;
        height: 1px;
      }
      .origin-y {
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .pltt-row {
        display: flex;
        align-items: center;
        gap: 2px;
        font-family: var(--font-mono);
      }
      .pltt-row > span:first-child {
        width: 3em;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 2px;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.25); /* 地の色に近い色でも見本の形が分かるように */
      }
      .pltt-list li {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .pltt-id {
        width: 3em;
        opacity: 0.5;
      }
      .pltt-id.used {
        opacity: 1;
      }
      .swatch.large {
        display: inline-block;
        width: 32px;
        height: 18px;
        vertical-align: middle;
      }
      .pltt-table {
        border-collapse: collapse;
        font-family: var(--font-mono);
      }
      .pltt-table th,
      .pltt-table td {
        padding: 1px 8px;
        text-align: left;
      }
      /* 右の欄のカード. 見出しは控えめな色の小さめの太字 */
      .card {
        background: var(--bg-card);
        border-radius: 6px;
        padding: 10px 14px 12px;
        margin-bottom: 12px;
      }
      /* カードの見出しは本文の色の小さめの太字 (中の項目名は控えめな色なので、見出しの方が強く見える) */
      .card > h3 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--text);
        cursor: pointer; /* 押すと折り畳む */
        user-select: none;
      }
      .card-chevron {
        display: inline-block;
        width: 1.1em;
        color: var(--text-dim);
      }
      .card.collapsed > :not(h3) {
        display: none;
      }
      .card.collapsed > h3 {
        margin-bottom: 0;
      }
      /* カードの中の設定の行: 左にラベル、右に部品 (components.tsx の Fields, Field) */
      .fields {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 14px;
        align-items: center;
      }
      .field-label {
        color: var(--text-dim);
        font-size: 14px;
        white-space: nowrap;
      }
      .field-value {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        min-width: 0;
      }
      .field-value select.wide {
        width: 100%;
      }
      .field-value select {
        max-width: 100%;
      }

      /* つながったボタン (◀ ▶, どれか 1 つを選ぶ切り替え) */
      .button-group {
        display: inline-flex;
      }
      .button-group > button {
        border-radius: 0;
      }
      .button-group > button + button {
        margin-left: -1px;
      }
      .button-group > button:first-child {
        border-radius: 4px 0 0 4px;
      }
      .button-group > button:last-child {
        border-radius: 0 4px 4px 0;
      }
      .button-group > button.selected {
        position: relative; /* 隣のボタンの枠より前に出して、選んでいるものの枠を見せる */
      }
      /* 表示するものを選ぶ一覧 (components.tsx の ToggleList): 1 行に 1 つ, 縞にする */
      .toggle-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .toggle-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        background: var(--stripe-odd);
        cursor: pointer;
      }
      .toggle-item:nth-child(even) {
        background: var(--stripe);
      }
      .toggle-item:hover {
        background: var(--bg-button);
      }
      .toggle-label {
        min-width: 3em;
        flex-shrink: 0;
      }
      .toggle-item .badge {
        flex-shrink: 0;
        white-space: nowrap;
      }
      .toggle-detail {
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 13px;
      }
      /* スライダー: つまみの列は残りの幅いっぱい, 値は等幅で右に */
      .slider {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 14em;
      }
      .slider input[type="range"] {
        flex: 1;
        min-width: 6em;
        margin: 0;
      }
      .slider-value {
        font-family: var(--font-mono);
        font-size: 14px;
        min-width: 4.5em;
        text-align: right;
        white-space: nowrap;
      }
      .check {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      /* カードの中の補足 (ソースでの使われ方, 注意書き など) */
      .note {
        color: var(--text-dim);
        font-size: 14px;
        margin: 0;
      }
      /* カードの中の要素どうしの間隔はここでそろえる (見出しの下, 行の並び, ボタンの行, 表, 補足) */
      .card > * {
        margin-top: 0;
        margin-bottom: 0;
      }
      .card > * + * {
        margin-top: 12px;
      }
      /* アニメのコマンド列 (components.tsx の AnimTimeline). 幅はフレーム数に比例 */
      .anim-timeline {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .anim-step {
        flex-basis: 0;
        min-width: 3.2em;
        display: flex;
        flex-direction: column;
        padding: 3px 5px;
        border-radius: 3px;
        background: var(--bg-button);
        cursor: default;
        overflow: hidden;
        white-space: nowrap;
      }
      .anim-step[title] {
        cursor: pointer;
      }
      .anim-step.current {
        background: var(--bg-selected);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .anim-step-dur {
        color: var(--text-dim);
        font-size: 11px;
      }
      /* Map の読み込み: 呼び出し 1 つを 1 項目にし、縞にする. 1 行目に種類と読み込むもの、2 行目にスクリプトと引数 */
      .load-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .load-item {
        padding: 6px 8px;
        border-radius: 4px;
        background: var(--stripe-odd);
      }
      .load-item:nth-child(even) {
        background: var(--stripe);
      }
      .load-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: baseline;
      }
      .load-kind {
        font-weight: bold;
        min-width: 5em;
      }
      .load-args {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        margin-top: 2px;
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .arg-key {
        color: var(--text-dim);
      }
      .badge {
        font-size: 12px;
        padding: 0 6px;
        border-radius: 3px;
        background: var(--bg-button);
        color: var(--text-dim);
      }
      /* 未対応のタブの案内 */
      .unsupported {
        margin: 0;
        padding: 12px 16px;
        color: var(--text-dim);
      }
      /* 説明 (decomp の定数のコメントなど) */
      .desc {
        color: var(--text-dim);
        margin: 0 0 12px;
      }
      /* 本体の欄の中の見出し (ポーズ一覧 など) */
      .stage-title {
        margin: 20px 0 8px;
        font-size: 14px;
        color: var(--text-dim);
      }
      /* ID の一覧と同じ縞にする表 (Collision のゾーン・経路) */
      .striped tbody tr:nth-child(odd) {
        background: var(--stripe-odd);
      }
      .striped tbody tr:nth-child(even) {
        background: var(--stripe);
      }
      .striped th,
      .striped td {
        padding: 4px 8px;
        white-space: nowrap; /* 右の欄が狭くても折り返さず、欄の中で横にスクロールする */
      }
      .striped.wrap th,
      .striped.wrap td {
        white-space: normal; /* 引数の並びなど長い値は折り返す */
        vertical-align: top;
      }
      /* Map, Tilemap, Collision: 見出しの下を、左に絵、右にそれ以外を並べる. 左右はそれぞれスクロールする. 画面幅が 900px より狭いときは縦に並べる */
      .sprite-view.split-view {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: 0;
      }
      .split {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 16px;
      }
      .split-canvas {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding-bottom: 24px;
      }
      /* 本体の絵は細い枠で範囲を見せる (市松模様が地の色に溶けないように) */
      .split-canvas > .canvas-wrap,
      .split-canvas > .overlay-host {
        box-shadow: 0 0 0 1px var(--border);
        margin-top: 2px;
      }
      .split-side {
        width: clamp(300px, 32vw, 560px); /* 表が折り返しにくいよう、広い画面では少し広げる */
        flex-shrink: 0;
        overflow: auto;
        padding-bottom: 24px;
      }
      .split-side.narrow {
        width: clamp(280px, 22vw, 360px);
      }
      @media (max-width: 900px) {
        .sprite-view.split-view {
          display: block;
          overflow: auto;
          padding-bottom: 24px;
        }
        .split {
          display: block;
        }
        .split-canvas,
        .split-side {
          width: auto;
          overflow: visible;
          padding-bottom: 0;
        }
      }
      /* BG Palette の 16 本: 1 本 1 行で縞にし、押して選ぶ. 選んでいる行は青で強調 */
      .bgpltt-grid {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: fit-content;
      }
      .bgpltt-grid .pltt-row {
        gap: 3px;
        padding: 4px 10px 4px 6px;
        border-radius: 4px;
        border-left: 3px solid transparent;
        background: var(--stripe-odd);
        cursor: pointer;
      }
      .bgpltt-grid .pltt-row:nth-child(even) {
        background: var(--stripe);
      }
      .bgpltt-grid .pltt-row:hover {
        background: var(--bg-button);
      }
      .bgpltt-grid .pltt-row.selected {
        background: var(--bg-selected);
        border-left-color: var(--accent);
      }
      .bgpltt-grid .pltt-row > span:first-child {
        width: 2.2em;
        color: var(--text-dim);
      }
      .bgpltt-grid .pltt-row.selected > span:first-child {
        color: var(--text);
      }
      .bgpltt-grid .swatch {
        width: 22px;
        height: 22px;
      }
      .bgpltt-grid .row-use {
        margin-left: 10px;
        color: var(--text-dim);
        font-family: var(--font-sans);
        font-size: 12px;
        min-width: 12em;
        white-space: nowrap;
      }
      /* 色の表 (ColorTable): 色の見本を大きく */
      .color-table .swatch.large {
        width: 44px;
        height: 22px;
      }
      .color-table + .note {
        margin-top: 6px;
      }
      .color-table th {
        color: var(--text-dim);
        font-weight: normal;
      }
      .color-table td:first-child {
        color: var(--text-dim);
      }
      /* スプライトの下のパレット (使っている plttID の 16 色) */
      .pltts {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 8px;
        font-size: 14px;
      }
      .pltts .pltt-row > span:first-child {
        width: 2.5em;
        color: var(--text-dim);
      }
      .bokc {
        font-family: var(--font-mono);
        font-size: 16px;
        line-height: 1.5;
        tab-size: 4;
        white-space: pre;
        overflow-x: auto;
        margin: 0;
        padding: 0.75em 1em;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .aliases {
        margin: 0.5em 0;
      }
      .aliases summary {
        cursor: pointer;
      }
      .sprite-list a {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .dim {
        opacity: 0.5;
      }
      button.selected {
        outline: 2px solid var(--accent);
      }
      .script-loads {
        font-size: 14px;
      }
      /* Sound の再生欄 */
      .player {
        background: var(--bg-card);
        border-radius: 6px;
        padding: 14px 16px;
        max-width: 560px;
        margin-bottom: 12px;
      }
      .player .seek {
        margin-top: 10px;
      }
      .player button.play {
        min-width: 6em;
        padding: 4px 16px;
        font-weight: bold;
      }
      .player p:last-child {
        margin-bottom: 0;
      }
      .seek input[type="range"] {
        flex: 1;
        max-width: 480px;
      }
      /* マウスの下の情報を出す1行, 何も無いときも高さを保つ. 空のときは案内を出す */
      .hover-line {
        min-height: 1.5em;
      }
      /* 詳細の表 (components.tsx の InfoTable): 項目名 | 値 の 2 列. 行は縞にし、長い値は値の列の中で折り返す */
      .info-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.45;
      }
      .info-table tr:nth-child(odd) {
        background: var(--stripe-odd);
      }
      .info-table tr:nth-child(even) {
        background: var(--stripe);
      }
      .info-table th,
      .info-table td {
        padding: 4px 8px;
        text-align: left;
        vertical-align: top;
      }
      .info-table th {
        width: 1%; /* 項目名の列は中身の幅だけ取る */
        color: var(--text-dim);
        font-weight: normal;
        white-space: nowrap;
      }
      .info-table td {
        overflow-wrap: anywhere;
      }
      .sub-table th {
        color: var(--text-dim);
        font-weight: normal;
        font-size: 13px;
      }
      .sub-table {
        font-size: 14px;
      }
      .sub-table td.links {
        white-space: normal; /* つながりの番号の列は長くなるので折り返す */

      /* 参照の一覧 (使っているもの, 使う Map など): 1 行に 1 つ, 種類 | リンク */
      .ref-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .ref-item {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 3px 8px;
        border-radius: 4px;
        background: var(--stripe-odd);
        font-size: 14px;
      }
      .ref-item:nth-child(even) {
        background: var(--stripe);
      }
      .ref-kind {
        color: var(--text-dim);
        min-width: 6.5em;
        font-size: 13px;
      }
      .ref-link {
        font-family: var(--font-mono);
      }
      .ref-detail {
        color: var(--text-dim);
        font-size: 13px;
      }
      /* メタタイルの 4 エントリ (2x2) */
      .mt-entries {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        gap: 2px;
        margin-top: 4px;
      }
      .mt-entry {
        display: flex;
        gap: 6px;
        padding: 1px 6px;
        border-radius: 3px;
        background: var(--bg-button);
        font-size: 13px;
      }
      .mt-sub {
        color: var(--text-dim);
      }
      /* マウスを乗せると絵の上で強調する一覧の行 (ゾーン, 経路) */
      .hover-rows tbody tr {
        cursor: default;
      }
      .hover-rows tbody tr.hl {
        background: var(--bg-selected);
      }
      .hover-rows tbody tr.hl.strong {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      /* 補足のツールチップ: カードの見出しの横の ?, 説明がある項目名の点線 */
      .tip {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-left: 6px;
        border-radius: 50%;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 11px;
        line-height: 13px;
        text-align: center;
        font-weight: normal;
        letter-spacing: 0;
        cursor: help;
        vertical-align: 1px;
      }
      .has-tip {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: help;
      }
      .link-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hover-info {
        min-height: 3em;
      }
      .load-link + .load-link {
        margin-left: 0.5em;
      }
      .overlay-host {
        position: relative;
        width: fit-content;
        margin: 0.5em 0;
      }
      .overlay-host .canvas-wrap {
        margin: 0;
      }
      .collision-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .collision-canvas {
        display: block;
        margin: 0.5em 0;
      }
      /* Collision の凡例: 値ごとに 1 行 (色, 値, タイル数). 押した値を強調する */
      .legend {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-family: var(--font-mono);
        font-size: 14px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
      }
      .legend-item:hover {
        background: var(--bg-button);
      }
      .legend-item.selected {
        background: var(--bg-selected);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .legend-name {
        flex: 1;
      }
      .legend-count {
        color: var(--text-dim);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .pltt-users {
        font-family: var(--font-mono);
      }
      /* ポーズ一覧: 1 つずつ小さなカードにし、押して選ぶ */
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: var(--bg-card);
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-dim);
      }
      .thumb:hover {
        border-color: var(--border);
      }
      .thumb.selected {
        border-color: var(--accent);
        background: var(--bg-selected);
        color: var(--text);
      }
      .thumb .canvas-wrap {
        margin: 0;
      }
    </style>
    <script type="module" src="./bundle.js"></script>
  </head>
