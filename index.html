<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>bokmagic-web</title>
    <meta name="description" content="ボクらの太陽シリーズの ROM のアセットビューワ" />
    <!-- SNS で URL を貼ったときのプレビュー (画像は付けない) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bokmagic-web" />
    <meta property="og:title" content="bokmagic-web" />
    <meta property="og:description" content="ボクらの太陽シリーズの ROM のアセットビューワ" />
    <meta property="og:url" content="https://akatsuki105.github.io/bokmagic-web/" />
    <meta name="twitter:card" content="summary" />
    <style>
      :root {
        color-scheme: light dark;
        /* ダークモードの地の色は、ごく弱い青みの灰色 (スレート). 外側ほど暗く、読む所ほど明るくして、線を引かずに領域を区切る
           ヘッダとタブ (--bg-side) < 一覧 (--bg-list) < 本文 (--bg-body) < カード (--bg-card). ライトモードは暖かい白で、カード以外は同じ色 */
        --bg-side: light-dark(#efedea, #17191d);
        --bg-list: light-dark(#efedea, #1c1f24);
        --bg-body: light-dark(#efedea, #22252b);
        --bg-card: light-dark(#f8f7f5, #2b2f36);
        --border: light-dark(#cfcac3, #3b4049);
        /* 絵の後ろの市松模様は、ドット絵の色の見え方を変えないよう無彩色のまま */
        --checker-a: light-dark(#ffffff, #3a3a3a);
        --checker-b: light-dark(#d8d8d8, #303030);
        /* 目が疲れにくいように、ダークモードの文字は白でなく少し暗い灰色にする. 控えめな文字は説明, 表の項目名, カードの見出し */
        --text: light-dark(#333b3c, #d3d7dd);
        --text-dim: light-dark(#6f7374, #8c939d);
        --link: light-dark(#2f55c9, #91a9f2);
        --error: light-dark(#cc3333, #ff8080);
        /* 選択と強調は青の 1 系統 */
        --accent: light-dark(#4a6cff, #7290ff);
        --bg-selected: light-dark(#cfd8ff, #34415f);
        /* 一覧の縞 */
        --stripe: light-dark(transparent, rgb(255 255 255 / 0.06)); /* 偶数行 (明るく) */
        --stripe-odd: light-dark(transparent, rgb(0 0 0 / 0.18)); /* 奇数行 (暗く) */
        /* ボタンと入力欄 (ブラウザ標準の見た目は暗い画面で浮くので自分で塗る) */
        --bg-input: light-dark(#ffffff, #16181c);
        --bg-button: light-dark(#e9e6e2, #353a43);
        --bg-button-hover: light-dark(#dedad4, #40464f);
        /* 英数字と日本語で字形がそろうように、フォントを具体的に指定する (日本語は等幅でもヒラギノなどの同じゴシックで出す) */
        --font-sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color: var(--text);
        background-color: var(--bg-body);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.6;
        overflow: hidden;
      }
      a {
        color: var(--link);
      }
      button,
      input,
      select {
        font-family: inherit;
        color: inherit;
      }
      input[type="number"],
      input[type="text"],
      input[type="search"],
      select {
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
      }
      button {
        background: var(--bg-button);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--bg-button-hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.selected {
        background: var(--bg-selected);
        border-color: var(--accent);
      }
      input[type="checkbox"],
      input[type="radio"],
      input[type="range"] {
        accent-color: var(--accent);
      }
      /* 表は行数が多いので、本文より少しだけ詰める (一覧は読みやすさを優先して .sprite-list で広めに取る) */
      .pltt-table {
        line-height: 1.4;
      }
      /* 画面の高さに収める: 上の1行は固定し、タブ・一覧・本文はそれぞれスクロールする */
      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 6px 12px;
        background: var(--bg-side);
        border-bottom: 1px solid light-dark(#cfcac3, transparent); /* ダークモードは背景の違いで区切る */
      }
      .app-header h1 {
        font-size: 18px;
        margin: 0 auto 0 0; /* タイトル以外は右に寄せる */
      }
      .app-header h1 a {
        color: inherit;
        text-decoration: none;
      }
      .rom-name {
        font-family: var(--font-mono);
      }
      .no-rom {
        padding: 0 12px;
        overflow-y: auto;
      }
      .no-rom h2 {
        font-size: 1.1em;
        margin: 1.5em 0 0.5em;
      }
      .saved-roms {
        border-collapse: collapse;
        margin-bottom: 1em;
      }
      .saved-roms th,
      .saved-roms td {
        padding: 4px 12px 4px 0;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .saved-roms th {
        font-weight: normal;
        opacity: 0.7;
      }
      button,
      input,
      select {
        font-size: 15px;
      }
      .spacer-y {
        height: 1.5em;
      }
      .error {
        color: var(--error);
      }
      .app-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .tab-body {
        display: contents;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        gap: 8px;
        padding-top: 8px;
        padding-right: 8px;
        overflow-y: auto;
        background: var(--bg-side);
        border-right: 1px solid light-dark(#dcd7d0, transparent); /* 一覧との区切り. ダークモードは背景の違いで区切る */
      }
      .tab {
        padding: 10px 14px;
        font-size: 18px;
        font-weight: bold;
        color: inherit;
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      .tab.selected {
        background: var(--bg-selected);
        border-left-color: var(--accent);
      }
      .viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
      }
      /* 左の一覧. 本文との間は隙間ではなく余白で空け、背景を途切れさせない */
      .viewer > .sprite-list,
      .viewer > .list-pane {
        background: var(--bg-list);
        padding: 8px 8px 0 12px;
        max-width: 25vw; /* 長い名前で本文が狭くならないように. はみ出す名前は「…」で切り、マウスを乗せると全体を出す (index.tsx) */
      }
      .stepper {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .anim-refs {
        font-family: var(--font-mono);
        font-size: 14px;
        margin: 0.25em 0;
        opacity: 0.8;
      }
      .sprite-list {
        list-style: none;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
        white-space: nowrap;
        overflow-y: auto;
        padding-top: 8px;
        font-family: var(--font-mono);
        font-size: 17px;
        line-height: 1.5;
      }
      /* 一覧の上に検索欄などがあるもの */
      .list-pane {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
        padding-top: 8px;
      }
      .list-pane > .sprite-list {
        flex: 1;
        min-height: 0;
        padding-top: 0;
      }
      .sprite-list li,
      .sprite-list a {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sprite-list li {
        padding: 6px 8px;
        cursor: pointer;
      }
      .sprite-list li:nth-child(odd) {
        background: var(--stripe-odd);
      }
      .sprite-list li:nth-child(even) {
        background: var(--stripe);
      }
      .sprite-list li.selected {
        background: var(--bg-selected);
      }
      .sprite-view {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 0 12px 24px 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1em;
        align-items: center;
      }
      .controls input[type="number"] {
        width: 5em;
      }
      .canvas-wrap {
        position: relative;
        margin: 0.5em 0;
        background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 16px 16px;
      }
      .canvas-wrap canvas {
        display: block;
        image-rendering: pixelated;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(to right, rgb(255 0 0 / 0.35) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 0 0 / 0.35) 1px, transparent 1px);
      }
      .origin-x,
      .origin-y {
        position: absolute;
        background: rgb(255 0 0 / 0.5);
        pointer-events: none;
      }
      .origin-x {
        left: 0;
        right: 0;
        height: 1px;
      }
      .origin-y {
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .pltt-row {
        display: flex;
        align-items: center;
        gap: 2px;
        font-family: var(--font-mono);
      }
      .pltt-row > span:first-child {
        width: 3em;
      }
      .swatch {
        width: 14px;
        height: 14px;
      }
      .pltt-list li {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .pltt-id {
        width: 3em;
        opacity: 0.5;
      }
      .pltt-id.used {
        opacity: 1;
      }
      .swatch.large {
        display: inline-block;
        width: 32px;
        height: 18px;
        vertical-align: middle;
      }
      .pltt-table {
        border-collapse: collapse;
        font-family: var(--font-mono);
      }
      .pltt-table th,
      .pltt-table td {
        padding: 1px 8px;
        text-align: left;
      }
      /* 右の欄のカード. 見出しは控えめな色の小さめの太字 */
      .card {
        background: var(--bg-card);
        border-radius: 6px;
        padding: 10px 14px 12px;
        margin-bottom: 12px;
      }
      .card > h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--text-dim);
      }
      .card .controls + .controls,
      .card .controls + .bgpltt-grid,
      .card .controls + p {
        margin-top: 8px;
      }
      .card .info-table {
        margin-top: 0;
      }
      .card p:first-of-type {
        margin-top: 0;
      }
      .card p:last-child,
      .card table:last-child {
        margin-bottom: 0;
      }
      /* 未対応のタブの案内 */
      .unsupported {
        margin: 0;
        padding: 12px 16px;
        color: var(--text-dim);
      }
      /* 説明 (decomp の定数のコメントなど) */
      .desc {
        color: var(--text-dim);
        margin: 0 0 12px;
      }
      /* 本体の欄の中の見出し (ポーズ一覧 など) */
      .stage-title {
        margin: 20px 0 8px;
        font-size: 14px;
        color: var(--text-dim);
      }
      /* ID の一覧と同じ縞にする表 (Collision のゾーン・経路) */
      .striped tbody tr:nth-child(odd) {
        background: var(--stripe-odd);
      }
      .striped tbody tr:nth-child(even) {
        background: var(--stripe);
      }
      .striped th,
      .striped td {
        padding: 4px 8px;
        white-space: nowrap; /* 右の欄が狭くても折り返さず、欄の中で横にスクロールする */
      }
      .striped.wrap th,
      .striped.wrap td {
        white-space: normal; /* 引数の並びなど長い値は折り返す */
        vertical-align: top;
      }
      /* Map, Tilemap, Collision: 見出しの下を、左に絵、右にそれ以外を並べる. 左右はそれぞれスクロールする. 画面幅が 900px より狭いときは縦に並べる */
      .sprite-view.split-view {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: 0;
      }
      .split {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 16px;
      }
      .split-canvas {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding-bottom: 24px;
      }
      .split-side {
        width: clamp(300px, 32vw, 560px); /* 表が折り返しにくいよう、広い画面では少し広げる */
        flex-shrink: 0;
        overflow: auto;
        padding-bottom: 24px;
      }
      .split-side.narrow {
        width: clamp(280px, 22vw, 360px);
      }
      @media (max-width: 900px) {
        .sprite-view.split-view {
          display: block;
          overflow: auto;
          padding-bottom: 24px;
        }
        .split {
          display: block;
        }
        .split-canvas,
        .split-side {
          width: auto;
          overflow: visible;
          padding-bottom: 0;
        }
      }
      .bgpltt-grid {
        width: fit-content;
        margin: 0.5em 0;
      }
      .bgpltt-grid .pltt-row {
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .bgpltt-grid .pltt-row.selected {
        background: var(--bg-selected);
        border-left-color: var(--accent);
      }
      .bokc {
        font-family: var(--font-mono);
        font-size: 16px;
        line-height: 1.5;
        tab-size: 4;
        white-space: pre;
        overflow-x: auto;
        margin: 0;
        padding: 0.75em 1em;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .aliases {
        margin: 0.5em 0;
      }
      .aliases summary {
        cursor: pointer;
      }
      .sprite-list a {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .dim {
        opacity: 0.5;
      }
      button.selected {
        outline: 2px solid var(--accent);
      }
      .script-loads {
        font-size: 14px;
      }
      /* Sound の再生欄 */
      .player {
        background: var(--bg-card);
        border-radius: 6px;
        padding: 14px 16px;
        max-width: 560px;
        margin-bottom: 12px;
      }
      .player .seek {
        margin-top: 10px;
      }
      .player button.play {
        min-width: 6em;
        padding: 4px 16px;
        font-weight: bold;
      }
      .player p:last-child {
        margin-bottom: 0;
      }
      .seek input[type="range"] {
        flex: 1;
        max-width: 480px;
      }
      /* マウスの下の情報を出す1行, 何も無いときも高さを保つ */
      .hover-line {
        min-height: 1.5em;
      }
      .info-table {
        margin-top: 1em;
      }
      .info-table th {
        color: var(--text-dim);
        font-weight: normal;
        padding-right: 1.2em;
        white-space: nowrap;
        vertical-align: top;
      }
      .hover-info {
        min-height: 3em;
      }
      .load-link + .load-link {
        margin-left: 0.5em;
      }
      .overlay-host {
        position: relative;
        width: fit-content;
        margin: 0.5em 0;
      }
      .overlay-host .canvas-wrap {
        margin: 0;
      }
      .collision-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .collision-canvas {
        display: block;
        margin: 0.5em 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-family: var(--font-mono);
        font-size: 14px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .legend-item.selected {
        outline: 2px solid var(--accent);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .pltt-users {
        font-family: var(--font-mono);
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 1em;
      }
      .thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 12px;
      }
      .thumb.selected {
        border-color: var(--accent);
      }
      .anim-panel {
        margin: 0;
      }
      .anim-panel .controls + .controls {
        margin-top: 0.5em;
      }
      .anim-status {
        font-family: var(--font-mono);
        margin: 0.5em 0;
      }
      .anim-cmds {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 14px;
      }
      .anim-cmd {
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 3px;
        cursor: pointer;
      }
      .anim-cmd.current {
        background: var(--bg-selected);
      }
      .thumb .canvas-wrap {
        margin: 0;
      }
    </style>
    <script type="module" src="./bundle.js"></script>
  </head>
</html>
